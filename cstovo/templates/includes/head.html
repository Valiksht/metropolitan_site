
{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
<link rel="icon" href="{% static 'favicon.png' %}" type="image/png">

<title>Кстовское благочиние</title>
<style>
    :root {
        --primary-color: #274468ff; /* Темно-синий, для заголовков, фона хедера/футера */
        --secondary-color: #292929ff; /* Серый, для текста */
        --accent-color: #bdd5e7ff; /* Оранжевый, для акцентов и кнопок */
        --title-color: #1a1a1aff;
        --text-color: #ffffffff;
        --text-color-light: #ffffff; /* Белый, для текста на темном фоне */
        --text-color-dark: #212121; /* Очень темный, почти черный */
        --hover-color: #000000ff; /* Темно-оранжевый при наведении */
        --mobile-menu-bg: rgba(0, 0, 0, 0.9); /* Полупрозрачный черный для мобильного меню */
        --transition-speed: 0.3s;
        --header-height: 102px; /* Установим фиксированную высоту хедера */
        --header-h: 0px;
        --menu-gap: 8px;
        {% if HEADER_BG_URL %}
          --header-bg: url("{{ HEADER_BG_URL }}");
        {% else %}
          --header-bg: rgba(24, 24, 24, 0.6);
        {% endif %}
    }
    body {
        font-family: 'TextFont', Arial, sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background-color: #fff;
        color: var(--secondary-color);
    }
    a {
        font-family: 'TitleFont';
        color: var(--accent-color);
        text-decoration: none;
        transition: color var(--transition-speed) ease;
    }
    a:hover, a:focus {
        color: var(--hover-color);
        text-decoration: underline;
    }
        h1, h2, h3 {
        font-family: 'TitleFont';
        font-weight: 700; /* Жирное начертание */
    }
    
 /* === HEADER: общий вид и сценарий 1 (широкие экраны) === */
header {
  position: relative;
  width: 100%;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px 16px;
  background: var(--header-bg, rgba(24, 24, 24, 0.6));
  background-size: cover;
  background-position: center top; /* Выравнивает по верху */
  background-repeat: no-repeat; /* Не повторяет изображение */
  color: var(--text-color);
  backdrop-filter: saturate(160%) blur(6px);
  height: auto;
  min-height: var(--header-height);
  padding: 0.5rem 0.8rem; 
  box-sizing: border-box;
  font-family: 'MyCustomFont';

}

header::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.45); /* Чёрный с прозрачностью 30% */
  backdrop-filter: blur(10px);
  z-index: -1; /* Позади содержимого header */
  
}


/* 1) Меню поверх картинки, но не фиксированное (не следует за экраном) */
header.is-home {
  position: absolute;          /* было fixed — убираем «прилипание» */
  top: 0; left: 0; right: 0;
  z-index: 1000;               /* выше оверлея и текста */
  background: transparent !important; /* убираем полупрозрачный цвет */
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
header.is-home::before {background: rgba(0, 0, 0, 0.0);}
header .logo {
  font-family: "PT Serif", Georgia, "Times New Roman", Times, serif;
  font-weight: 700; /* строгий, но не тяжёлый; можно 600–700 */
  flex: 0 1 auto;
  min-width: 0;
  display: inline-block;
  font-size: clamp(12px, 1.5vw, 18px);
  font-weight: bold;
  line-height: 1.15;
  letter-spacing: 0.3px;
  color: var(--text-color);
  text-decoration: none;
  white-space: normal !important;
}
header .logo .logo-br {
  display: block;
  height: 0;         /* без лишних зазоров */
  line-height: 0;
  margin: 0;
  padding: 0;
}
header nav {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
}
/* Бургер по умолчанию скрыт (появится в сценарии 3) */
header .hamburger-menu {
  display: none;
  flex-direction: column;
  justify-content: space-around;
  width: 30px;
  height: 25px;
  cursor: pointer;
  border: none;
  background: transparent;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  z-index: 1100;
}
header .hamburger-menu span {
  display: block;
  width: 100%;
  height: 3px;
  background-color: var(--text-color);
  transition: all var(--transition-speed) ease-in-out;
  border-radius: 2px;
}
header .hamburger-menu.open span:nth-child(1) { transform: translateY(11px) rotate(45deg); }
header .hamburger-menu.open span:nth-child(2) { opacity: 0; }
header .hamburger-menu.open span:nth-child(3) { transform: translateY(-11px) rotate(-45deg); }
/* Меню — одна строка на широких */
header .nav-menu {
  position: relative; /* для линии-разделителя в сценарии 2 */
  display: flex;
  align-items: center;
  gap: 1.3rem;
  margin: 0;
  padding: 0;
  list-style: none;
  flex-wrap: nowrap;
  white-space: nowrap;
}
header .nav-menu li { position: relative; }
header .nav-menu li a {
  color: var(--text-color);
  text-decoration: none;
  font-size: 1.5rem;
  padding: 0.5rem 0;
  transition: color var(--transition-speed) ease;
  white-space: nowrap;
}
header .nav-menu li a:hover,
header .nav-menu li a:focus {
  color: var(--hover-color);
  text-decoration: underline;
  outline: none;
}
/* Дропдауны (поведение по hover на десктопе) */
header .has-dropdown .dropdown-arrow {
  margin-left: 5px;
  font-size: 0.8em;
  vertical-align: middle;
  transition: transform 0.3s ease;
}
header .has-dropdown:hover .dropdown-arrow { transform: rotate(180deg); }
header .dropdown-menu {
  display: none;
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  min-width: 440px;
  background-color: #fff;
  box-shadow: 0 8px 16px rgba(0,0,0,0.2);
  z-index: 1000;
  list-style: none;
  padding: 0;
  margin: 0;
  border-radius: 5px;
  overflow: hidden;
}
header .dropdown-menu li a {
  display: block;
  text-align: center;
  color: var(--primary-color);
  padding: 10px 15px;
  text-decoration: none;
  transition: background-color 0.2s ease;
}
header .dropdown-menu li a:hover {
  background-color: #f0f0f0;
  color: var(--hover-color);
}
header .has-dropdown:hover > .dropdown-menu { display: block; }
header .has-dropdown.align-right > .dropdown-menu {
  left: auto;
  right: 0;
}
header .icon-btn {
  color: #fff;
  background: transparent;
  border: 0;
  cursor: pointer;
  padding: 6px;
}



header {
  flex-wrap: wrap; /* уже было в вашем коде */
}
/* 2) Строка поиска занимает всю ширину и идет третьим элементом */
header .search-bar {
  display: none;
  flex: 0 0 100%;
  width: 100%;
  order: 3;
  border-top: 1px solid #eee;
  padding: 12px;
  background: transparent;
}
header .search-bar.is-open {
  display: block;             /* показываем при .is-open */
}
/* 3) Контейнер формы — центрируем и ограничиваем ширину (кадр для компонента) */
header .search-form {
  max-width: 720px;   /* можно увеличить/уменьшить по желанию */
  margin: 0 auto;
}
/* 4) СТИЛИ КОМПОНЕНТА (из вашего референса), локализованы под header */
header .input-container {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  height: 2.5rem;
  width: 100%;
  max-width: 35rem;            /* узкий аккуратный инпут внутри рамки формы */
  background-color: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border-radius: 0.5rem;
  padding: 0.35rem;
  margin: 0 auto;              /* центрируем сам блок инпута */
}
header .input-container input[type="search"] {
  flex: 1;
  height: 100%;
  border: none;
  background-color: transparent;
  padding: 0.75rem;
  font-size: 1rem;
  outline: none;
  border-radius: 0.375rem;
  min-width: 0;
}
header .search-btn {
  width: auto;
  height: 100%;
  border-radius: 0.35rem;
  background-color: gray;
  opacity: 0.5;
  color: #fff;
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  border: none;
  cursor: pointer;
  padding: 0.5rem;
  pointer-events: none;
  transition: all 0.15s ease;
}
/* Активируем кнопку, когда поле не пустое */
header .input-container input[type="search"]:not(:placeholder-shown) + .search-btn {
  background-color: var(--primary-color);
  opacity: 5;
  pointer-events: auto;
}

.search-toggle-mobile { display: none; }

/* === Сценарий 2: до 992px — лого в две строки, меню «пополам» в две строки + тонкая линия === */
@media (max-width: 1400px) {
  /* ВАЖНО: принудительно показываем меню, даже если где-то было display: none */
  header .nav-menu {
    display: grid !important;
    grid-auto-flow: column;           /* заполняем по колонкам */
    grid-auto-columns: max-content;   /* ширина колонок = ширине пунктов */
    grid-template-rows: repeat(2, auto);
    align-items: center;
    column-gap: 1.2rem;
    row-gap: 0.6rem;
    white-space: nowrap;
    position: relative;
  }
  /* Тонкая белая линия между 1-й и 2-й строками меню */
  header .nav-menu::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    height: 1px;
    background: rgba(255, 255, 255, 0.7);
    pointer-events: none;
  }
  /* Логотип переносится на две строки */
  header .logo {
    font-family: "PT Serif", Georgia, "Times New Roman", Times, serif;
    font-weight: 700; /* строгий, но не тяжёлый; можно 600–700 */
    font-size: clamp(18px, 1.6vw, 16px);
    white-space: normal !important;
    overflow-wrap: normal;
    line-height: 1.15;
    letter-spacing: 0.3px;
  }
    header .logo .logo-br {
    display: block;
    height: 0;         /* без лишних зазоров */
    line-height: 0;
    margin: 0;
    padding: 0;
    }
  /* Подменю можно оставить как есть; при нехватке места подумайте о click-логике */
  header .dropdown-menu { min-width: 360px; }
}
/* === Сценарий 3: до ~720px — лого снова в одну строку, справа бургер, меню off-canvas === */
@media (max-width: 1050px) {
    header { position: relative; }
    
    header .logo {
    grid-column: 1 / -1;
    font-family: "PT Serif", Georgia, "Times New Roman", Times, serif;
    font-weight: 700; /* строгий, но не тяжёлый; можно 600–700 */
    white-space: normal !important;
    overflow-wrap: normal;
    padding-right: 56px;
    font-size: clamp(16px, 1.6vw, 16px);
    letter-spacing: 0.3px;
    max-width: none !important;
    padding-right: 56px;
  }
    header .logo .logo-br {
    display: block;
    height: 0;         /* без лишних зазоров */
    line-height: 0;
    margin: 0;
    padding: 0;
  }
  header .hamburger-menu {
    display: flex;                    /* показываем бургер */
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 1000;
  }
  /* off-canvas меню: по умолчанию скрыто за правым краем */
  header .nav-menu {
    display: flex !important;         /* поверх grid из сценария 2 */
    flex-direction: column;
    gap: 1rem;
    position: fixed;
    top: 0;
    right: 0;
    width: 100%;
    height: 100vh;
    padding: 5.5rem 2rem 2rem;        /* отступ под фиксированную шапку */
    background-color: var(--mobile-menu-bg);
    transform: translate3d(100%, 0, 0);           /* GPU-акселерация */
    transition: transform 380ms cubic-bezier(0.2, 0.8, 0.2, 1);
    will-change: transform;                        /* подсказываем браузеру */
    backface-visibility: hidden;
    contain: paint; 
    white-space: normal;
    overflow-y: auto;
    z-index: 999;
  }
  header .nav-menu.open {
    transform: translateX(0);
  }

  /* Линию-разделитель убираем в режиме off-canvas */
  header .nav-menu::after {
    display: none;
  }
  header .nav-menu li a:hover,
  header .nav-menu li a:focus {
    color: var(--accent-color);
    text-decoration: underline;
    outline: none;
  }

  header .nav-menu li.search-item { display: none; }
  .search-toggle-mobile {
    display: flex;
    position: absolute;
    top: 8px;
    right: 56px; /* слева от бургера (burger right:12px, ширина ~30px) */
    z-index: 1000;
  }
  header .input-container {
    max-width: 100%;
  }

}
/* Доступность */
header .hamburger-menu:focus-visible {
  outline: 2px solid var(--accent-color);
  outline-offset: 3px;
}
header .nav-menu li a:focus-visible {
  outline: 2px solid var(--accent-color);
  outline-offset: 3px;
  border-radius: 3px;
}

        
    /* Basic content for demonstration */
