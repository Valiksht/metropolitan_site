<script>
(function() {
  // Защита от повторной инициализации (если скрипт случайно подключат дважды)
  if (window.__MAIN_NAV_INIT__) return;
  window.__MAIN_NAV_INIT__ = true;

  document.addEventListener('DOMContentLoaded', () => {
    const DESKTOP_BP = 1050; // синхронизирован с CSS
    const hamburgerMenu = document.querySelector('.hamburger-menu');
    const navMenu = document.getElementById('main-nav-menu');

    const isDesktop = () => window.innerWidth > DESKTOP_BP;

    function closeAllDropdowns() {
      if (!navMenu) return;
      navMenu.querySelectorAll('.has-dropdown.is-open').forEach(li => {
        li.classList.remove('is-open');
        const t = li.querySelector('.dropdown-toggle');
        if (t) t.setAttribute('aria-expanded', 'false');
      });
    }

    // --- Гамбургер ---
    if (hamburgerMenu && navMenu) {
      function ensureMobileHomeItem() {
        if (window.innerWidth > 720) return;
        if (!navMenu.querySelector('.mobile-home-item')) {
          const li = document.createElement('li');
          li.className = 'mobile-home-item';
          const a = document.createElement('a');
          a.href = document.querySelector('a.logo')?.href || '/';
          a.textContent = 'Главная';
          li.appendChild(a);
          navMenu.insertBefore(li, navMenu.firstChild);
        }
      }

      function removeMobileHomeItem() {
        const li = navMenu.querySelector('.mobile-home-item');
        if (li) li.remove();
      }

      function toggleMenu() {
        const isOpen = hamburgerMenu.classList.toggle('open');
        navMenu.classList.toggle('open');
        hamburgerMenu.setAttribute('aria-expanded', String(isOpen));

        if (isOpen) {
          document.body.style.overflow = 'hidden';
          ensureMobileHomeItem();
        } else {
          document.body.style.overflow = '';
          closeAllDropdowns();
          hamburgerMenu.focus();
        }
      }

      hamburgerMenu.addEventListener('click', (e) => {
        e.preventDefault();
        toggleMenu();
      });

      // В моб. меню клики по обычным ссылкам закрывают off-canvas; по родителю подменю — нет
      navMenu.addEventListener('click', (e) => {
        const link = e.target.closest('a');
        if (!link) return;
        const isDropdownToggle = link.classList.contains('dropdown-toggle');
        if (navMenu.classList.contains('open') && !isDesktop() && !isDropdownToggle) {
          toggleMenu();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          if (navMenu.classList.contains('open')) toggleMenu();
          closeAllDropdowns();
        }
      });

      // Клик вне off-canvas — закрыть меню
      document.addEventListener('click', (event) => {
        if (
          navMenu.classList.contains('open') &&
          !navMenu.contains(event.target) &&
          !hamburgerMenu.contains(event.target)
        ) {
          toggleMenu();
        }
      });

      window.addEventListener('resize', () => {
        if (isDesktop() && navMenu.classList.contains('open')) {
          hamburgerMenu.classList.remove('open');
          navMenu.classList.remove('open');
          hamburgerMenu.setAttribute('aria-expanded', 'false');
          document.body.style.overflow = '';
        }
        if (window.innerWidth > 720) removeMobileHomeItem();
        closeAllDropdowns();
      });
    }

    // --- Подменю: единая логика (клик — открыть/закрыть) ---
    if (navMenu) {
      // Тоггл по клику на родителе
      navMenu.addEventListener('click', (e) => {
        const toggle = e.target.closest('.dropdown-toggle');
        if (!toggle) return;

        // гарантируем, что это именно родитель подменю
        const li = toggle.closest('.has-dropdown');
        if (!li) return;

        e.preventDefault();

        const willOpen = !li.classList.contains('is-open');

        // На десктопе закрываем остальные
        if (isDesktop()) {
          navMenu.querySelectorAll('.has-dropdown.is-open').forEach(other => {
            if (other !== li) {
              other.classList.remove('is-open');
              const t = other.querySelector('.dropdown-toggle');
              if (t) t.setAttribute('aria-expanded', 'false');
            }
          });
        }

        li.classList.toggle('is-open', willOpen);
        toggle.setAttribute('aria-expanded', String(willOpen));
      });

      // Клик вне — закрыть подменю (только десктоп)
      document.addEventListener('click', (e) => {
        if (!isDesktop()) return;
        if (!navMenu.contains(e.target)) {
          closeAllDropdowns();
        }
      });

      // Клавиатура
      navMenu.addEventListener('keydown', (e) => {
        const toggle = e.target.closest('.dropdown-toggle');
        if (!toggle) return;
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggle.click();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          const li = toggle.closest('.has-dropdown');
          li?.classList.remove('is-open');
          toggle.setAttribute('aria-expanded', 'false');
          toggle.focus();
        }
      });
    }
  });
})();

(function () {
  const bar = document.getElementById('search-bar');
  const desktopBtn = document.getElementById('search-toggle');
  const mobileBtn = document.getElementById('search-toggle-mobile');

  function toggleBar(btn) {
    if (!bar) return;

    // Переключаем класс is-open вместо атрибута hidden
    const isOpen = bar.classList.contains('is-open');
    if (isOpen) {
      bar.classList.remove('is-open');
      btn?.setAttribute('aria-expanded', 'false');
    } else {
      bar.classList.add('is-open');
      btn?.setAttribute('aria-expanded', 'true');
      const input = bar.querySelector('input[name="q"]');
      setTimeout(() => input?.focus(), 0);
    }
  }

  desktopBtn?.addEventListener('click', () => toggleBar(desktopBtn));
  mobileBtn?.addEventListener('click', () => toggleBar(mobileBtn));
})();
</script>
